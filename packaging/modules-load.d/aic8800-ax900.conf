# aicsemi AIC8800D80 — load order for aic8800-ax900
#
# udev's modalias autoload would find both modules on its own, but the dongle
# enumerates 1111:1111 -> a69c:8d80 -> a69c:8d81 within a couple of seconds
# of boot and races the udev settle queue when several USB devices are
# plugging in at once. Loading them here makes the sequence deterministic.
#
# aic_load_fw must come first: it is the module that performs the
# a69c:8d80 -> a69c:8d81 transition. aic8800_fdrv has nothing to attach to
# until that has happened, so it registers its driver early and binds later.
aic_load_fw
aic8800_fdrv

# aic_zlp_quirk works around the controller failing to report completion for ACL
# bulk OUT transfers unless they are ZLP-terminated. Without it PipeWire reports
# "Missing completion reports for packet ... adapter firmware bug?" and tears the
# A2DP transport down after a couple of minutes, which is audible as the audio
# cutting out and coming back. See README.md.
#
# It matches both USB identities the controller appears under in the field:
# 368b:8d81 and a69c:8d81.
aic_zlp_quirk