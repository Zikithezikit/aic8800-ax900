# DKMS package for the aicsemi AIC8800D80 USB dongle (a69c:8d80 -> a69c:8d81).
#
# Owns three modules:
#   aic_load_fw     boot-mode firmware downloader  (binds a69c:8d80)
#   aic8800_fdrv    fullmac Wi-Fi driver          (binds a69c:8d81 / 368b:8d85)
#   aic_zlp_quirk   btusb ACL bulk-TX ZLP quirk   (device-scoped, 368b:8d81)
#
# Replaces the stock aic8800/radxa package, which builds but binds neither
# stage of this dongle's boot handshake.
#
# LOCATION: this file lives at packaging/dkms.conf in the repository, not at
# the root, so that packaging/ owns all deployment artefacts in one place.
# DKMS insists on reading <source_dir>/dkms.conf, so packaging/scripts/stage.sh
# copies it to the root of the staged tree before `dkms add`.

PACKAGE_NAME="aic8800-ax900"
PACKAGE_VERSION="1.0.0"

# Built in-tree from kernel/aic8800. CONFIG_PLATFORM_UBUNTU=y in that Makefile
# makes it honour KVER/KDIR, which DKMS passes through.
KDIR="/lib/modules/${kernelver}/build"
TREE="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

MAKE[0]="make -C ${KDIR} M=${TREE}/kernel/aic8800 modules"

CLEAN="make -C ${KDIR} M=${TREE}/kernel/aic8800 clean"

# --- aic_load_fw -----------------------------------------------------------
BUILT_MODULE_NAME[0]="aic_load_fw"
BUILT_MODULE_LOCATION[0]="kernel/aic8800/aic_load_fw"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# --- aic8800_fdrv ----------------------------------------------------------
# Must be installed after aic_load_fw: modinfo records it as a hard dependency.
BUILT_MODULE_NAME[1]="aic8800_fdrv"
BUILT_MODULE_LOCATION[1]="kernel/aic8800/aic8800_fdrv"
DEST_MODULE_LOCATION[1]="/updates/dkms"

# --- aic_zlp_quirk ---------------------------------------------------------
BUILT_MODULE_NAME[2]="aic_zlp_quirk"
BUILT_MODULE_LOCATION[2]="kernel/aic8800/aic_zlp_quirk"
DEST_MODULE_LOCATION[2]="/updates/dkms"

# Ship the firmware blobs alongside the modules so a kernel upgrade never
# leaves the driver with nothing to download onto the chip. Both modules load
# blobs through request_firmware(), so they must live under /lib/firmware.
POST_INSTALL="packaging/scripts/post_install.sh"

AUTOINSTALL="yes"