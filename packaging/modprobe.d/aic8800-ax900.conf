# aicsemi AIC8800D80 — module options and usbcore quirks for aic8800-ax900

# ---------------------------------------------------------------------------
# Log level
# ---------------------------------------------------------------------------
# aic_load_fw defaults to LOGERROR|LOGINFO|LOGDEBUG|LOGTRACE (0xf) and
# aic8800_fdrv to LOGERROR|LOGINFO|LOGFW (0x203). Both flood the kernel log:
# a single firmware download is several thousand lines, and it happens again
# on every replug. 1 = LOGERROR only.
#
# Raise it temporarily when debugging:
#     sudo sh -c 'echo 15 > /sys/module/aic_load_fw/parameters/aicwf_dbg_level'
#     sudo sh -c 'echo 2  > /sys/module/aic8800_fdrv/parameters/aicwf_dbg_level'
options aic_load_fw   aicwf_dbg_level=1
options aic8800_fdrv  aicwf_dbg_level=1

# ---------------------------------------------------------------------------
# avoid_reset_quirk for devices already present at boot
# ---------------------------------------------------------------------------
# usbcore.quirks=<vid>:<pid>:<bcdDevice>:v avoids the port reset. Setting it
# here covers the case where the dongle is plugged in at boot; the udev rule
# in 50-aic8800-ax900.rules covers hotplug. Keep the two lists in sync.
#
# 368b:8d85:0100 is this dongle's operational ID on variants that re-enumerate
# onto the 368b vendor ID instead of staying on a69c.
# a69c:8d80:0100 and a69c:8d81:0100 are the two states this dongle passes
# through on a69c (bcdDevice 1.00).
# 368b:8d83:0100 is the BT-only sibling handled by aic_zlp_quirk.
# Commented out by default: the udev rule already covers hotplug and boot,
# and a stale quirks list is a common source of "device works until reboot"
# confusion. Uncomment when a specific machine wedges on a cold boot.
#
# options usbcore quirks=368b:8d85:0100:v
# options usbcore quirks=a69c:8d80:0100:v
# options usbcore quirks=a69c:8d81:0100:v

# ---------------------------------------------------------------------------
# aic_load_fw must be resident before aic8800_fdrv binds 368b:8d85
# ---------------------------------------------------------------------------
# modinfo already records `depends=aic_load_fw` on aic8800_fdrv, so modprobe
# orders them correctly. This softdep additionally covers the udev modalias
# path, where the kernel asks for aic8800_fdrv by alias rather than by name.
softdep aic8800_fdrv pre: aic_load_fw